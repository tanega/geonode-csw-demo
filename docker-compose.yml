version: "3.8"

# Squelette d'infra — étape 1 (socle conteneurisé).
# Images/versions à affiner à l'étape 2 (déploiement GeoNode + CSW).

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - geonode-net

  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - geonode-net

  geoserver:
    image: kartoza/geoserver:2.24.0
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geoserver.rule=Host(`${DOMAIN}`) && PathPrefix(`/geoserver`)"
    networks:
      - geonode-net

  # geonode: image/orchestration officielle à intégrer à l'étape 2
  # (portail + pycsw pour l'endpoint CSW /catalogue/csw)

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.${DOMAIN}`)"
    networks:
      - geonode-net

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.titiler.rule=Host(`${DOMAIN}`) && PathPrefix(`/titiler`)"
    networks:
      - geonode-net

  # analytics (DuckDB): pas de service daemon officiel — à implémenter
  # étape 4 comme petit wrapper (ex: FastAPI + duckdb) exposant les requêtes
  # sur les fichiers GeoParquet stockés dans MinIO.

networks:
  geonode-net:

volumes:
  pgdata:
  miniodata:

version: "3.8"

# Étape 2 — déploiement GeoNode + CSW.
# Services django/celery/geoserver/db/redis calqués sur la stack officielle
# GeoNode (docker-compose.yml + .env.sample upstream:
# https://github.com/GeoNode/geonode). Nginx/Letsencrypt upstream sont
# volontairement omis — Traefik tient le rôle de reverse proxy (décision
# actée étape 1); conséquence: pas de service statique dédié, django sert
# lui-même API/CSW (suffisant pour la vérification CSW, le rendu de l'UI web
# GeoNode restera dégradé sans nginx).
# Tags d'image + variables d'env vérifiés contre l'API Docker Hub et le
# docker-compose.yml/.env.sample upstream le 2026-07-29 (voir
# docs/step2-geonode-csw.md).

x-geonode-env: &geonode-common-env
  DJANGO_SETTINGS_MODULE: geonode_demo_settings
  PYTHONPATH: /opt/geonode-custom
  AUTO_ASSIGN_REGISTERED_MEMBERS_TO_CONTRIBUTORS: "False"
  SITEURL: "${SITEURL}/"
  ALLOWED_HOSTS: "['django', '${DOMAIN}']"
  SECRET_KEY: ${GEONODE_SECRET_KEY}
  DATABASE_URL: postgis://${GEONODE_DATABASE_USER}:${GEONODE_DATABASE_PASSWORD}@db:5432/${GEONODE_DATABASE}
  GEODATABASE_URL: postgis://${GEONODE_GEODATABASE_USER}:${GEONODE_GEODATABASE_PASSWORD}@db:5432/${GEONODE_GEODATABASE}
  BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  GEONODE_LB_HOST_IP: django
  GEONODE_LB_PORT: 8000
  GEOSERVER_LB_HOST_IP: geoserver
  GEOSERVER_LB_PORT: 8080
  GEOSERVER_LOCATION: "http://geoserver:8080/geoserver/"
  GEOSERVER_PUBLIC_LOCATION: "${SITEURL}/geoserver/"
  GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
  GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
  ADMIN_USERNAME: ${GEONODE_ADMIN_USER}
  ADMIN_PASSWORD: ${GEONODE_ADMIN_PASSWORD}
  ADMIN_EMAIL: ${GEONODE_ADMIN_EMAIL}
  OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
  OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  # Needed by uploads_api's post-upload GeoParquet mirror task
  # (geonode-custom/uploads_api/tasks.py) to reach MinIO directly from
  # django/celery, same values titiler/duckdb-api already use.
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET}

x-geonode-volumes: &geonode-common-volumes
  - ./geonode-custom:/opt/geonode-custom:ro
  - statics:/mnt/volumes/statics
  - geoserver-data-dir:/geoserver_data/data
  - backup-restore:/backup_restore
  - geonode-data:/data
  - geonode-tmp:/tmp

services:
  traefik:
    image: traefik:v3.7.9
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - geonode-net

  db:
    image: geonode/postgis:15-3.5-latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GEONODE_DATABASE: ${GEONODE_DATABASE}
      GEONODE_DATABASE_USER: ${GEONODE_DATABASE_USER}
      GEONODE_DATABASE_PASSWORD: ${GEONODE_DATABASE_PASSWORD}
      GEONODE_GEODATABASE: ${GEONODE_GEODATABASE}
      GEONODE_GEODATABASE_USER: ${GEONODE_GEODATABASE_USER}
      GEONODE_GEODATABASE_PASSWORD: ${GEONODE_GEODATABASE_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - geonode-net

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - geonode-net

  django:
    image: geonode/geonode:5.0.0
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: "uwsgi --ini /usr/src/geonode/uwsgi.ini"
    environment:
      <<: *geonode-common-env
      IS_CELERY: "False"
    depends_on:
      - db
      - redis
    volumes: *geonode-common-volumes
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    networks:
      - geonode-net

  celery:
    image: geonode/geonode:5.0.0
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: "celery-cmd"
    environment:
      <<: *geonode-common-env
      IS_CELERY: "True"
    depends_on:
      - django
    volumes: *geonode-common-volumes
    networks:
      - geonode-net

  geoserver:
    image: geonode/geoserver:2.28.x-latest
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      GEONODE_GEODATABASE: ${GEONODE_GEODATABASE}
      GEONODE_GEODATABASE_USER: ${GEONODE_GEODATABASE_USER}
      GEONODE_GEODATABASE_PASSWORD: ${GEONODE_GEODATABASE_PASSWORD}
      GEONODE_LB_HOST_IP: django
      GEONODE_LB_PORT: 8000
      GEOSERVER_LB_HOST_IP: geoserver
      GEOSERVER_LB_PORT: 8080
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOSERVER_JAVA_OPTS: ${GEOSERVER_JAVA_OPTS}
    depends_on:
      - django
    volumes: *geonode-common-volumes
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geoserver.rule=Host(`${DOMAIN}`) && PathPrefix(`/geoserver`)"
      - "traefik.http.services.geoserver.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.geoserver-cors.headers.accessControlAllowOriginList=*"
      - "traefik.http.middlewares.geoserver-cors.headers.accessControlAllowMethods=GET,HEAD,OPTIONS"
      - "traefik.http.middlewares.geoserver-cors.headers.accessControlAllowHeaders=*"
      - "traefik.http.middlewares.geoserver-cors.headers.accessControlMaxAge=100"
      - "traefik.http.middlewares.geoserver-cors.headers.addVaryHeader=true"
      - "traefik.http.routers.geoserver.middlewares=geoserver-cors"
    networks:
      - geonode-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.${DOMAIN}`)"
    networks:
      - geonode-net

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    environment:
      AWS_S3_ENDPOINT: "minio:9000"
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
    depends_on:
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.titiler.rule=Host(`${DOMAIN}`) && PathPrefix(`/titiler`)"
      - "traefik.http.services.titiler.loadbalancer.server.port=80"
      - "traefik.http.middlewares.titiler-strip.stripprefix.prefixes=/titiler"
      - "traefik.http.routers.titiler.middlewares=titiler-strip"
    networks:
      - geonode-net

  duckdb-api:
    build: ./analytics
    environment:
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      - minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.duckdb-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/analytics`)"
      - "traefik.http.services.duckdb-api.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.duckdb-api-strip.stripprefix.prefixes=/analytics"
      - "traefik.http.routers.duckdb-api.middlewares=duckdb-api-strip"
    networks:
      - geonode-net

  web:
    build:
      context: ./web
      args:
        VITE_GEONODE_API_BASE: ${SITEURL}
        VITE_OAUTH_CLIENT_ID: ${WEB_OAUTH_CLIENT_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`www.localhost`)"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    networks:
      - geonode-net

networks:
  geonode-net:

volumes:
  dbdata:
  redisdata:
  statics:
  geoserver-data-dir:
  backup-restore:
  geonode-data:
  geonode-tmp:
  miniodata:

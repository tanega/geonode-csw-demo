version: "3.8"

# Étape 2 — déploiement GeoNode + CSW.
# Services django/celery/geoserver/db/redis calqués sur la stack officielle
# GeoNode (docker-compose.yml upstream: https://github.com/GeoNode/geonode).
# Nginx/Letsencrypt upstream sont volontairement omis — Traefik tient le rôle
# de reverse proxy (décision actée étape 1).
# Tags d'image vérifiés contre l'API Docker Hub le 2026-07-29 (voir
# docs/step2-geonode-csw.md pour le détail des corrections).

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - geonode-net

  db:
    image: geonode/postgis:15-3.5-latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - geonode-net

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - geonode-net

  django:
    image: geonode/geonode:5.0.0
    environment:
      IS_CELERY: "False"
      SITEURL: "http://${DOMAIN}/"
      ALLOWED_HOSTS: "['${DOMAIN}']"
      DATABASE_URL: postgis://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEODATABASE_URL: postgis://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${GEONODE_GEODATABASE}
      BROKER_URL: redis://redis:6379/0
      GEOSERVER_LOCATION: "http://geoserver:8080/geoserver/"
      GEOSERVER_PUBLIC_LOCATION: "http://${DOMAIN}/geoserver/"
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      ADMIN_USERNAME: ${GEONODE_ADMIN_USER}
      ADMIN_PASSWORD: ${GEONODE_ADMIN_PASSWORD}
      ADMIN_EMAIL: ${GEONODE_ADMIN_EMAIL}
    depends_on:
      - db
      - redis
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
      - geonode-data:/data
      - geonode-tmp:/tmp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    networks:
      - geonode-net

  celery:
    image: geonode/geonode:5.0.0
    environment:
      IS_CELERY: "True"
      SITEURL: "http://${DOMAIN}/"
      ALLOWED_HOSTS: "['${DOMAIN}']"
      DATABASE_URL: postgis://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEODATABASE_URL: postgis://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${GEONODE_GEODATABASE}
      BROKER_URL: redis://redis:6379/0
      GEOSERVER_LOCATION: "http://geoserver:8080/geoserver/"
      GEOSERVER_PUBLIC_LOCATION: "http://${DOMAIN}/geoserver/"
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
    depends_on:
      - django
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
      - geonode-data:/data
      - geonode-tmp:/tmp
    networks:
      - geonode-net

  geoserver:
    image: geonode/geoserver:2.28.x-latest
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
    depends_on:
      - django
    volumes:
      - geoserver-data-dir:/geoserver_data/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geoserver.rule=Host(`${DOMAIN}`) && PathPrefix(`/geoserver`)"
      - "traefik.http.services.geoserver.loadbalancer.server.port=8080"
    networks:
      - geonode-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.${DOMAIN}`)"
    networks:
      - geonode-net

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.titiler.rule=Host(`${DOMAIN}`) && PathPrefix(`/titiler`)"
    networks:
      - geonode-net

  # analytics (DuckDB): pas de service daemon officiel — à implémenter
  # étape 4 comme petit wrapper (ex: FastAPI + duckdb) exposant les requêtes
  # sur les fichiers GeoParquet stockés dans MinIO.

networks:
  geonode-net:

volumes:
  dbdata:
  redisdata:
  statics:
  geoserver-data-dir:
  backup-restore:
  geonode-data:
  geonode-tmp:
  miniodata:
